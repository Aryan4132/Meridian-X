[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-x"
version = "0.1.6"
description = "Autonomous, multimodal local-first desktop AI operating system and intelligent agent framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Meridian Team", email = "dev@meridian-x.local" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "pydantic>=2.10.0",
    "pymongo>=4.6.0",
    "ollama>=0.3.0",
    "playwright>=1.40.0",
    "psutil>=6.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "watchdog>=4.0.0",
    "apscheduler>=3.10.0",
    "slowapi>=0.1.9",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["meridian_backend/src", "meridian_backend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "W293", # blank line contains whitespace
    "W291", # trailing whitespace
    "E402", # module level import not at top of file (common in conditional imports)
    "UP007", # allow Optional/Union typing
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["meridian_backend/tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
