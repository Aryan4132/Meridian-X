name: Compile & Package Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            tauri-args: --bundles nsis,msi
          - os: macos-latest
            platform: macos
            tauri-args: --bundles dmg
          - os: ubuntu-latest
            platform: linux
            tauri-args: --bundles deb,appimage

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # --- System Dependencies for Linux ---
    - name: Install Linux System Dependencies
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

    # --- Setup Node.js & NPM dependencies ---
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: './meridian_frontend/package-lock.json'

    - name: Install Frontend Dependencies
      run: |
        cd meridian_frontend
        npm install --include=optional

    # --- Setup Rust Compiler ---
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    # --- Setup Python Environment & Package Backend ---
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Create Backend Virtualenv & Install Requirements (Windows)
      if: matrix.platform == 'windows'
      run: |
        cd meridian_backend
        python -m venv venv
        ./venv/Scripts/pip.exe install --upgrade pip
        ./venv/Scripts/pip.exe install -r requirements.txt
        ./venv/Scripts/pip.exe install pyinstaller
      shell: bash

    - name: Create Backend Virtualenv & Install Requirements (POSIX)
      if: matrix.platform != 'windows'
      run: |
        cd meridian_backend
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip
        ./venv/bin/pip install -r requirements.txt
        ./venv/bin/pip install pyinstaller
      shell: bash

    - name: Compile Standalone Backend Sidecar
      run: |
        python build_standalone.py --sidecar-only
      shell: bash

    # --- Install NSIS (Windows only) ---
    - name: Install NSIS
      if: matrix.platform == 'windows'
      run: choco install nsis -y
      shell: pwsh

    # --- Build Tauri Desktop App ---
    - name: Build Tauri Desktop Installer
      run: |
        cd meridian_frontend
        npm run tauri build -- ${{ matrix.tauri-args }}

    # --- Upload Artifacts to GitHub Release ---
    - name: Upload Release Assets to GitHub
      uses: softprops/action-gh-release@v1
      with:
        files: |
          meridian_frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
          meridian_frontend/src-tauri/target/release/bundle/msi/*.msi
          meridian_frontend/src-tauri/target/release/bundle/dmg/*.dmg
          meridian_frontend/src-tauri/target/release/bundle/deb/*.deb
          meridian_frontend/src-tauri/target/release/bundle/appimage/*.AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
