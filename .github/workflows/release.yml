name: Compile & Package Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

# ────────────────────────────────────────────────────────────────
# JOB 1: Build Python backend sidecar for each platform
# Output: sidecar-{windows|macos|linux} GitHub Artifact
# ────────────────────────────────────────────────────────────────
jobs:
  build-backend:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # --- System Dependencies for Linux ---
    - name: Install Linux System Dependencies
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          portaudio19-dev \
          libsndfile1 \
          libffi-dev \
          libssl-dev \
          build-essential \
          libgomp1

    # --- System Dependencies for macOS ---
    - name: Install macOS System Dependencies
      if: matrix.platform == 'macos'
      run: brew install portaudio libsndfile

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Create Virtualenv & Install Requirements
      shell: bash
      run: |
        cd meridian_backend
        python -m venv venv
        if [ "$RUNNER_OS" == "Windows" ]; then
          ./venv/Scripts/python.exe -m pip install --upgrade pip setuptools wheel
          ./venv/Scripts/pip.exe install pyinstaller
          # Install core requirements line by line so missing optional platform wheels never block sidecar compilation
          ./venv/Scripts/python.exe -c "
import subprocess, sys
with open('requirements.txt', 'r') as f:
    for line in f:
        req = line.strip()
        if req and not req.startswith('#'):
            subprocess.run([sys.executable, '-m', 'pip', 'install', req])
"
        else
          ./venv/bin/python -m pip install --upgrade pip setuptools wheel
          ./venv/bin/pip install pyinstaller
          ./venv/bin/python -c "
import subprocess, sys
with open('requirements.txt', 'r') as f:
    for line in f:
        req = line.strip()
        if req and not req.startswith('#'):
            subprocess.run([sys.executable, '-m', 'pip', 'install', req])
"
        fi

    - name: Compile Python Backend Sidecar
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          ./meridian_backend/venv/Scripts/python build_standalone.py --sidecar-only
        else
          ./meridian_backend/venv/bin/python build_standalone.py --sidecar-only
        fi

    - name: Upload Sidecar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sidecar-${{ matrix.platform }}
        path: meridian_frontend/src-tauri/api
        retention-days: 1

# ────────────────────────────────────────────────────────────────
# JOB 2: Build Tauri desktop app with embedded sidecar & publish release
# ────────────────────────────────────────────────────────────────
  build-tauri:
    needs: build-backend
    permissions:
      contents: write
    env:
      CI: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            tauri-args: "--bundles nsis,msi"
          - os: macos-latest
            platform: macos
            tauri-args: "--bundles dmg"
          - os: ubuntu-latest
            platform: linux
            tauri-args: "--bundles deb,appimage"

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # --- Download Sidecar Artifact compiled in Job 1 ---
    - name: Download Sidecar Artifact
      uses: actions/download-artifact@v4
      with:
        name: sidecar-${{ matrix.platform }}
        path: meridian_frontend/src-tauri/api

    # --- System Dependencies for Linux ---
    - name: Install Linux System Dependencies
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl wget file \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf \
          squashfs-tools

    # --- System Dependencies for macOS ---
    - name: Install macOS System Dependencies
      if: matrix.platform == 'macos'
      run: brew install create-dmg

    # --- Setup Node.js ---
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # --- Install Frontend Dependencies ---
    - name: Install Frontend Dependencies
      shell: bash
      run: |
        cd meridian_frontend
        rm -f package-lock.json
        npm install

    # --- Setup Rust Compiler ---
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    # --- Install NSIS (Windows only) ---
    - name: Install NSIS
      if: matrix.platform == 'windows'
      shell: pwsh
      run: choco install nsis -y

    # --- Clean Stale Bundles ---
    - name: Clean Previous Release Bundles
      shell: bash
      run: |
        rm -rf meridian_frontend/src-tauri/target/release/bundle

    # --- Build Tauri App & Upload to Release ---
    - name: Build Tauri App & Upload Release
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CI: true
      with:
        tagName: ${{ github.ref_name }}
        releaseName: 'Meridian-X ${{ github.ref_name }}'
        releaseBody: 'Automated multi-platform release for ${{ github.ref_name }}'
        releaseDraft: false
        prerelease: false
        projectPath: './meridian_frontend'
        args: ${{ matrix.tauri-args }}
