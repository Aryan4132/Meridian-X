name: Compile & Package Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            tauri-args: "-b nsis,msi"
          - os: macos-latest
            platform: macos
            tauri-args: "-b app,dmg"
          - os: ubuntu-latest
            platform: linux
            tauri-args: "-b deb"

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # --- System Dependencies for Linux ---
    - name: Install Linux System Dependencies
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf squashfs-tools

    # --- Setup Node.js & NPM dependencies ---
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Frontend Dependencies
      run: |
        cd meridian_frontend
        npm install --force

    # --- Setup Rust Compiler ---
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    # --- Setup Python Environment & Package Backend ---
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Create Backend Virtualenv & Install Requirements
      run: |
        cd meridian_backend
        python -m venv venv
        if [ "$RUNNER_OS" == "Windows" ]; then
          ./venv/Scripts/python.exe -m pip install --upgrade pip setuptools wheel
          ./venv/Scripts/pip.exe install pyinstaller fastapi uvicorn pydantic psutil httpx requests pillow numpy onnxruntime || true
          ./venv/Scripts/pip.exe install -r requirements.txt || true
        else
          ./venv/bin/python -m pip install --upgrade pip setuptools wheel
          ./venv/bin/pip install pyinstaller fastapi uvicorn pydantic psutil httpx requests pillow numpy onnxruntime || true
          ./venv/bin/pip install -r requirements.txt || true
        fi
      shell: bash

    - name: Compile Standalone Backend Sidecar
      run: |
        python build_standalone.py --sidecar-only
      shell: bash

    # --- Install NSIS (Windows only) ---
    - name: Install NSIS
      if: matrix.platform == 'windows'
      run: choco install nsis -y
      shell: pwsh

    # --- Build Tauri App & Publish Release ---
    - name: Build Tauri App & Upload Release
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tagName: ${{ github.ref_name }}
        releaseName: 'Meridian-X ${{ github.ref_name }}'
        releaseBody: 'Automated multi-platform compilation release for ${{ github.ref_name }}'
        releaseDraft: false
        prerelease: false
        projectPath: './meridian_frontend'
        args: ${{ matrix.tauri-args }}
