name: Build & Release Multi-Platform Installer

on:
  push:
    tags:
      - 'v*'

# ────────────────────────────────────────────────────────────────
# JOB 1 — Compile Python backend sidecar for each platform
# Output: sidecar-{windows|macos|linux} GitHub Artifact
# ────────────────────────────────────────────────────────────────
jobs:
  build-backend:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Linux System Dependencies
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          portaudio19-dev \
          libsndfile1 \
          libffi-dev \
          libssl-dev \
          build-essential \
          libgomp1

    - name: Install macOS System Dependencies
      if: matrix.platform == 'macos'
      run: brew install portaudio libsndfile

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # ── Windows: PowerShell pip loop ──
    - name: Create Virtualenv & Install Requirements (Windows)
      if: matrix.platform == 'windows'
      shell: pwsh
      run: |
        cd meridian_backend
        python -m venv venv
        .\venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
        .\venv\Scripts\pip.exe install pyinstaller

        Get-Content requirements.txt | ForEach-Object {
          $line = $_.Trim()
          if ($line -and -not $line.StartsWith('#')) {
            Write-Host "Installing: $line"
            $proc = Start-Process -FilePath ".\venv\Scripts\pip.exe" `
              -ArgumentList "install", $line, "--no-warn-script-location" `
              -Wait -PassThru -NoNewWindow
            if ($proc.ExitCode -ne 0) {
              Write-Warning "Skipped (install failed): $line"
            }
          }
        }

    # ── macOS / Linux: bash pip loop ──
    - name: Create Virtualenv & Install Requirements (Unix)
      if: matrix.platform != 'windows'
      shell: bash
      run: |
        cd meridian_backend
        python -m venv venv
        ./venv/bin/python -m pip install --upgrade pip setuptools wheel
        ./venv/bin/pip install pyinstaller

        while IFS= read -r line || [[ -n "$line" ]]; do
          line="$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ -n "$line" && ! "$line" == \#* ]]; then
            echo "Installing: $line"
            ./venv/bin/pip install "$line" --no-warn-script-location || \
              echo "WARNING: Skipped (install failed): $line"
          fi
        done < requirements.txt

    # ── Compile sidecar ──
    - name: Compile Python Backend Sidecar (Windows)
      if: matrix.platform == 'windows'
      shell: pwsh
      run: |
        .\meridian_backend\venv\Scripts\python.exe build_standalone.py --sidecar-only

    - name: Compile Python Backend Sidecar (Unix)
      if: matrix.platform != 'windows'
      shell: bash
      run: |
        ./meridian_backend/venv/bin/python build_standalone.py --sidecar-only

    - name: Upload Sidecar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sidecar-${{ matrix.platform }}
        path: meridian_frontend/src-tauri/api
        retention-days: 1

# ────────────────────────────────────────────────────────────────
# JOB 2 — Build Tauri app (embeds sidecar) & publish release
# One installer per OS: Windows=NSIS .exe | macOS=DMG | Linux=AppImage
# ────────────────────────────────────────────────────────────────
  build-tauri:
    needs: build-backend
    permissions:
      contents: write
    env:
      CI: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            tauri-args: '--bundles nsis'
          - os: macos-latest
            platform: macos
            tauri-args: '--bundles dmg'
          - os: ubuntu-latest
            platform: linux
            tauri-args: '--bundles appimage'

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Sidecar Artifact
      uses: actions/download-artifact@v4
      with:
        name: sidecar-${{ matrix.platform }}
        path: meridian_frontend/src-tauri/api

    - name: Flatten & Verify Sidecar Layout
      shell: bash
      run: |
        echo "=== Verifying meridian_frontend/src-tauri/api contents ==="
        mkdir -p meridian_frontend/src-tauri/api
        if [ -d "meridian_frontend/src-tauri/api/api" ]; then
          echo "Flattening nested api directory..."
          cp -r meridian_frontend/src-tauri/api/api/* meridian_frontend/src-tauri/api/
          rm -rf meridian_frontend/src-tauri/api/api
        fi
        if [ "$RUNNER_OS" != "Windows" ]; then
          chmod -R +x meridian_frontend/src-tauri/api
        fi
        ls -la meridian_frontend/src-tauri/api

    - name: Install Linux System Dependencies
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl wget file \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf \
          squashfs-tools \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libsoup-3.0-dev \
          wmctrl xdotool || true
        sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

    - name: Install macOS System Dependencies
      if: matrix.platform == 'macos'
      run: brew install create-dmg

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Frontend Dependencies
      shell: bash
      run: |
        cd meridian_frontend
        rm -f package-lock.json
        npm install

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install NSIS (Windows only)
      if: matrix.platform == 'windows'
      shell: pwsh
      run: choco install nsis -y

    - name: Clean Previous Release Bundles
      shell: bash
      run: |
        rm -rf meridian_frontend/src-tauri/target/release/bundle

    - name: Build Tauri App & Upload Release
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CI: true
      with:
        tagName: ${{ github.ref_name }}
        releaseName: 'Meridian-X ${{ github.ref_name }}'
        releaseBody: |
          ## Meridian-X ${{ github.ref_name }}

          Single installer per platform — bundles the full AI backend and desktop UI.

          | Platform | File |
          |----------|------|
          | Windows  | `*-setup.exe` (NSIS installer) |
          | macOS    | `*.dmg` |
          | Linux    | `*.AppImage` |
        releaseDraft: true
        prerelease: false
        projectPath: './meridian_frontend'
        args: ${{ matrix.tauri-args }}
