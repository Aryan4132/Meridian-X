name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libsndfile1 build-essential

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            meridian_backend/requirements.txt
            requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r meridian_backend/requirements.txt
          pip install -r requirements-dev.txt

      # Hard gate: syntax errors + undefined names only (style is not gated yet)
      - name: Ruff (syntax & undefined names)
        run: ruff check . --select E9,F63,F7,F82

      # Soft gate until the existing type debt is paid down
      - name: Pyright (non-blocking)
        continue-on-error: true
        run: pyright meridian_backend || true

      - name: Run Test Suite
        env:
          MERIDIAN_DATA_DIR: ${{ runner.temp }}/meridian-test-data
        run: pytest meridian_backend/tests -q --tb=short
