name: Verify Backend, Frontend & Mobile

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libsndfile1 libffi-dev libssl-dev build-essential libgomp1 libgl1 libglx-mesa0 libasound2-dev xvfb

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'meridian_backend/requirements.txt'

      - name: Install Backend Requirements & Linters
        run: |
          cd meridian_backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint with Ruff
        run: |
          cd meridian_backend
          ruff check src --exit-zero

      - name: Run Backend Test Suite
        run: |
          cd meridian_backend
          xvfb-run -a python -m pytest tests/ -v \
            -k "not voice and not wakeword and not vad" \
            --ignore=tests/test_day5_features.py \
            --ignore=tests/test_voice_hardening.py \
            --ignore=tests/test_voice_speed.py \
            --ignore=tests/test_wakeword_continuous.py \
            --ignore=tests/test_wakeword_onnx.py \
            --ignore=tests/test_silero_vad.py

      - name: Report Test Failures
        if: failure()
        run: |
          cd meridian_backend
          python -m pytest tests/ --lf -v --tb=short > failure_report.txt 2>&1 || true
          cat failure_report.txt
          FAIL_MSG=$(tail -n 25 failure_report.txt | tr '\n' ' ' | tr -d '"')
          echo "::error title=Pytest Failure::$FAIL_MSG"


  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'meridian_frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd meridian_frontend
          npm ci

      - name: Typecheck Frontend
        run: |
          cd meridian_frontend
          npx tsc --noEmit

      - name: Build Frontend
        run: npm --prefix meridian_frontend run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Mobile Dependencies
        run: |
          cd meridian_mobile
          flutter pub get

      - name: Analyze Mobile
        run: |
          cd meridian_mobile
          flutter analyze

      - name: Run Mobile Tests
        run: |
          cd meridian_mobile
          flutter test
