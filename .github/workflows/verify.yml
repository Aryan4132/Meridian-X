name: Verify Backend, Frontend & Mobile

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libsndfile1 libffi-dev libssl-dev build-essential libgomp1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'meridian_backend/requirements.txt'

      - name: Install Backend Requirements
        run: |
          cd meridian_backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Test Suite
        run: python -m pytest meridian_backend/tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'meridian_frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd meridian_frontend
          npm ci

      - name: Typecheck Frontend
        run: |
          cd meridian_frontend
          npx tsc --noEmit

      - name: Build Frontend
        run: npm --prefix meridian_frontend run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Mobile Dependencies
        run: |
          cd meridian_mobile
          flutter pub get

      - name: Analyze Mobile
        run: |
          cd meridian_mobile
          flutter analyze

      - name: Run Mobile Tests
        run: |
          cd meridian_mobile
          flutter test
