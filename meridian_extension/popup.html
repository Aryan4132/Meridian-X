<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meridian-X AI Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .badge-on { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-off { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot-on { background: #10b981; box-shadow: 0 0 6px #10b981; }
    .dot-off { background: #ef4444; }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .card-title { color: #94a3b8; font-size: 10px; text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
    .card-val { color: #e2e8f0; font-weight: 500; word-break: break-all; }

    .btn {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
      margin-top: 6px;
    }
    .btn:hover { background: #0369a1; }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.14); }
    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 10px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>MERIDIAN-X</span>
    </div>
    <div id="statusBadge" class="badge badge-off">
      <span id="statusDot" class="dot dot-off"></span>
      <span id="statusText">DISCONNECTED</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Active Chrome Tab</div>
    <div id="tabTitle" class="card-val">Detecting...</div>
  </div>

  <div class="card">
    <div class="card-title">Meridian Backend Target</div>
    <div id="portVal" class="card-val">ws://127.0.0.1:4132/api/browser/extension</div>
  </div>

  <button id="sendBtn" class="btn">
    Send Tab to Meridian Agent
  </button>
  <button id="reconnectBtn" class="btn btn-secondary">
    Reconnect Bridge
  </button>

  <div class="footer">
    Zero profile lock • Uses active Google/GitHub sessions
  </div>

  <script src="popup.js"></script>
</body>
</html>
